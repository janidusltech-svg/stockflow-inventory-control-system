spring.application.name=StockFlow

spring.datasource.url=jdbc:mysql://localhost:3306/stockflow_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Colombo
spring.datasource.username=${STOCKFLOW_DB_USERNAME:root}
spring.datasource.password=${STOCKFLOW_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8080

# Local security hardening. Keep secrets in environment variables, not this file.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# Change this local demonstration password through the environment before deployment.
stockflow.security.bootstrap-password=${STOCKFLOW_BOOTSTRAP_PASSWORD:StockFlow@2026}
stockflow.security.seed-demo-users=${STOCKFLOW_SEED_DEMO_USERS:true}
