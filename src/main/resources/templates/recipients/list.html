<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Recipients')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="page">
    <div class="page-header">
        <div>
            <p class="eyebrow">Function 05 · Stock Issue &amp; Return Management</p>
            <h1>Recipients</h1>
            <p>Maintain customers and internal departments that receive stock.</p>
        </div>
        <div class="header-actions">
            <a class="button" th:href="@{/stock-issues}">View Stock Issues</a>
            <a class="button primary" th:if="${canManageIssuesAndReturns}" th:href="@{/recipients/new}">Add Recipient</a>
        </div>
    </div>

    <div class="alert success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert error-alert" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form class="filter-panel recipient-filter" method="get" th:action="@{/recipients}">
        <label>Search
            <input type="search" name="keyword" th:value="${keyword}"
                   placeholder="Code, name, contact or email">
        </label>
        <label>Status
            <select name="active">
                <option value="" th:selected="${selectedActive == null}">All statuses</option>
                <option value="true" th:selected="${selectedActive == true}">Active</option>
                <option value="false" th:selected="${selectedActive == false}">Inactive</option>
            </select>
        </label>
        <div class="filter-actions">
            <a class="button" th:href="@{/recipients}">Clear</a>
            <button class="button primary" type="submit">Apply Filters</button>
        </div>
    </form>

    <div class="table-panel"><div class="table-scroll"><table>
        <thead><tr><th>Code</th><th>Recipient</th><th>Type</th><th>Contact</th><th>Status</th><th class="actions" th:if="${canManageIssuesAndReturns}">Actions</th></tr></thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(recipients)}"><td th:colspan="${canManageIssuesAndReturns ? 6 : 5}" class="empty">No recipients found.</td></tr>
        <tr th:each="recipient : ${recipients}">
            <td><strong th:text="${recipient.code}">REC-001</strong></td>
            <td><strong th:text="${recipient.name}">Name</strong><small th:if="${recipient.address}" th:text="${recipient.address}"></small></td>
            <td th:text="${#strings.replace(recipient.recipientType.name(), '_', ' ')}">CUSTOMER</td>
            <td><span th:text="${recipient.contactName != null ? recipient.contactName : '-'}"></span><small th:text="${recipient.phone != null ? recipient.phone : (recipient.email != null ? recipient.email : 'No contact details')}"></small></td>
            <td><span class="status active" th:if="${recipient.active}">ACTIVE</span><span class="status inactive" th:unless="${recipient.active}">INACTIVE</span></td>
            <td class="actions" th:if="${canManageIssuesAndReturns}">
                <a class="button small" th:href="@{/recipients/{id}/edit(id=${recipient.id})}">Edit</a>
                <form th:if="${recipient.active}" th:action="@{/recipients/{id}/deactivate(id=${recipient.id})}" method="post"><button class="button small danger" type="submit">Deactivate</button></form>
                <form th:unless="${recipient.active}" th:action="@{/recipients/{id}/activate(id=${recipient.id})}" method="post"><button class="button small primary" type="submit">Activate</button></form>
                <form th:action="@{/recipients/{id}/delete(id=${recipient.id})}" th:data-confirm-message="${'Permanently delete recipient ' + recipient.code + '? The system will first check for stock issues. This cannot be undone.'}" method="post"><button class="button small danger" type="submit">Delete</button></form>
            </td>
        </tr>
        </tbody>
    </table></div></div>
</main>
</body>
</html>
