<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Stock Transfers')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="page">
    <header class="page-header">
        <div>
            <p class="eyebrow">Function 04</p>
            <h1>Stock Transfers</h1>
            <p>Move available products and batches between active storage locations.</p>
        </div>
        <div class="header-actions">
            <a class="button" th:href="@{/warehouses}">Manage Warehouses</a>
            <a class="button primary" th:href="@{/stock-transfers/new}">Create Transfer</a>
        </div>
    </header>

    <div class="alert success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert error-alert" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form class="filter-panel transfer-filter" method="get" th:action="@{/stock-transfers}">
        <label>
            Search
            <input type="search" name="keyword" th:value="${keyword}"
                   placeholder="Transfer number or location">
        </label>
        <label>
            Status
            <select name="status">
                <option value="">All statuses</option>
                <option th:each="statusValue : ${statuses}"
                        th:value="${statusValue}"
                        th:selected="${statusValue == selectedStatus}"
                        th:text="${#strings.replace(statusValue.name(), '_', ' ')}">DRAFT</option>
            </select>
        </label>
        <div class="filter-actions">
            <a class="button" th:href="@{/stock-transfers}">Clear</a>
            <button class="button primary" type="submit">Apply Filter</button>
        </div>
    </form>

    <div class="table-panel table-scroll">
        <table>
            <thead>
            <tr>
                <th>Transfer</th>
                <th>Date</th>
                <th>Source</th>
                <th>Destination</th>
                <th>Items</th>
                <th>Status</th>
                <th class="actions">Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="transfer : ${stockTransfers}">
                <td><strong th:text="${transfer.transferNumber}">TRF-2026-0001</strong></td>
                <td th:text="${#temporals.format(transfer.transferDate, 'dd MMM yyyy')}">Date</td>
                <td th:text="${transfer.sourceLocation.displayName}">Source</td>
                <td th:text="${transfer.destinationLocation.displayName}">Destination</td>
                <td>
                    <strong th:text="${transfer.items.size()}">1</strong>
                    <small th:text="${transfer.totalQuantity + ' units'}">4 units</small>
                </td>
                <td>
                    <span class="status"
                          th:classappend="${#strings.toLowerCase(transfer.status.name())}"
                          th:text="${#strings.replace(transfer.status.name(), '_', ' ')}">DRAFT</span>
                </td>
                <td class="actions">
                    <a class="button small"
                       th:href="@{/stock-transfers/{id}(id=${transfer.id})}">Open</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(stockTransfers)}">
                <td colspan="7" class="empty">No stock transfers match the filter.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
