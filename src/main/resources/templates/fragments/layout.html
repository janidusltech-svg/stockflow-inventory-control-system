<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | StockFlow'">StockFlow</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/stock-issue-return.css}">
    <link rel="stylesheet" th:href="@{/css/warehouse-transfer.css}">
    <link rel="stylesheet" th:href="@{/css/inventory-control.css}">
</head>
<body>
<nav th:fragment="nav" class="topbar">
    <a class="brand" th:href="@{/dashboard}">
        <span class="brand-mark">SF</span>
        <span>
            <strong>StockFlow</strong>
            <small>Lanka Fresh Distributors</small>
        </span>
    </a>
    <div class="nav-links">
        <a th:if="${canViewProducts}"
           th:href="@{/products}">Products</a>
        <a th:if="${canViewPurchasing}"
           th:href="@{/purchase-orders}">Purchasing</a>
        <a th:if="${canViewReceiving}"
           th:href="@{/goods-receipts}">Receiving</a>
        <a th:if="${canManageWarehouses}"
           th:href="@{/warehouses}">Warehouses</a>
        <a th:if="${canManageWarehouses}"
           th:href="@{/stock-transfers}">Transfers</a>
        <a th:if="${canViewIssuesAndReturns}"
           th:href="@{/stock-issues}">Issues &amp; Returns</a>
        <a th:if="${canManageInventoryControl}"
           th:href="@{/inventory-control}">Inventory Control</a>
        <a th:if="${canManageUsers}"
           th:href="@{/user-accounts}">User Accounts</a>
    </div>
    <div class="nav-account" th:if="${authenticatedUser}">
        <span class="account-avatar" aria-hidden="true">U</span>
        <div class="account-copy">
            <strong th:text="${currentUsername}">username</strong>
            <small th:text="${currentRoleLabel}">Authorized user</small>
        </div>
        <form th:action="@{/logout}" method="post">
            <button class="sign-out-button" type="submit" title="Sign out">Sign out</button>
        </form>
    </div>
</nav>
</body>
</html>
