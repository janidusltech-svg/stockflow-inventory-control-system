<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="page narrow">
    <div class="page-header">
        <div>
            <p class="eyebrow">Product Catalogue Management</p>
            <h1 th:text="${pageTitle}">Add Product</h1>
            <p>Enter the product master information used by every stock process.</p>
        </div>
        <a class="button" th:href="@{/reference-data}">Manage Categories, Brands &amp; Units</a>
    </div>

    <form class="form-panel"
          th:action="${formAction}"
          th:object="${productForm}"
          method="post">

        <div class="alert"
             th:if="${#fields.hasGlobalErrors()}">
            <p th:each="error : ${#fields.globalErrors()}"
               th:text="${error}"></p>
        </div>

        <div class="form-grid">
            <label>
                SKU
                <input th:field="*{sku}" placeholder="Example: MILK-400G">
                <small class="error"
                       th:if="${#fields.hasErrors('sku')}"
                       th:errors="*{sku}"></small>
            </label>

            <label>
                Barcode
                <input th:field="*{barcode}" placeholder="Optional barcode">
                <small class="error"
                       th:if="${#fields.hasErrors('barcode')}"
                       th:errors="*{barcode}"></small>
            </label>

            <label>
                Product Name
                <input th:field="*{name}" placeholder="Example: Milk Powder 400g">
                <small class="error"
                       th:if="${#fields.hasErrors('name')}"
                       th:errors="*{name}"></small>
            </label>

            <label>
                Category
                <select th:field="*{categoryId}">
                    <option value="">Select category</option>
                    <option th:each="category : ${categories}"
                            th:value="${category.id}"
                            th:text="${category.name}">
                    </option>
                </select>
                <small class="error"
                       th:if="${#fields.hasErrors('categoryId')}"
                       th:errors="*{categoryId}"></small>
            </label>

            <label>
                Brand
                <select th:field="*{brandId}">
                    <option value="">No brand</option>
                    <option th:each="brand : ${brands}"
                            th:value="${brand.id}"
                            th:text="${brand.name}">
                    </option>
                </select>
            </label>

            <label>
                Unit
                <select th:field="*{unitId}">
                    <option value="">Select unit</option>
                    <option th:each="unit : ${units}"
                            th:value="${unit.id}"
                            th:text="${unit.name}">
                    </option>
                </select>
                <small class="error"
                       th:if="${#fields.hasErrors('unitId')}"
                       th:errors="*{unitId}"></small>
            </label>

            <label class="checkbox-line">
                <input type="checkbox" th:field="*{batchTracked}">
                Track batch and expiry information
            </label>

            <label class="checkbox-line">
                <input type="checkbox" th:field="*{active}">
                Active product
            </label>
        </div>

        <label>
            Description
            <textarea th:field="*{description}"
                      rows="4"
                      placeholder="Short product description"></textarea>
            <small class="error"
                   th:if="${#fields.hasErrors('description')}"
                   th:errors="*{description}"></small>
        </label>

        <div class="form-actions">
            <a class="button ghost" th:href="@{/products}">Cancel</a>
            <button class="button primary" type="submit">Save Product</button>
        </div>
    </form>
</main>
</body>
</html>
