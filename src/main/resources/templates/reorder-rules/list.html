<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reorder Rules')}"></head>
<body><nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="page"><div class="page-header"><div><p class="eyebrow">Function 06 · Reordering</p><h1>Reorder Rules</h1><p>Set minimum, maximum and suggested reorder quantities for each product.</p></div><div class="header-actions"><a class="button" th:href="@{/inventory-control}">Dashboard</a><a class="button primary" th:href="@{/reorder-rules/new}">Create Rule</a></div></div>
    <div class="alert success" th:if="${successMessage}" th:text="${successMessage}"></div><div class="alert error-alert" th:if="${errorMessage}" th:text="${errorMessage}"></div>
    <div class="table-panel"><div class="table-scroll"><table><thead><tr><th>Product</th><th>Current</th><th>Minimum</th><th>Maximum</th><th>Reorder Qty</th><th>Level</th><th>Rule</th><th class="actions">Actions</th></tr></thead><tbody>
    <tr th:if="${#lists.isEmpty(rules)}"><td colspan="8" class="empty">No reorder rules created.</td></tr>
    <tr th:each="rule : ${rules}" th:with="alert=${alertMap[rule.id]}">
        <td><strong th:text="${rule.product.sku + ' - ' + rule.product.name}">Product</strong><small th:text="${rule.product.unit.name}">Unit</small></td>
        <td th:text="${alert != null ? alert.currentQuantity : 0}">0</td>
        <td th:text="${rule.minimumLevel}">0</td><td th:text="${rule.maximumLevel}">0</td><td th:text="${rule.reorderQuantity}">0</td>
        <td><span class="status" th:if="${alert != null}" th:classappend="${#strings.toLowerCase(alert.levelStatus)}" th:text="${#strings.replace(alert.levelStatus, '_', ' ')}">NORMAL</span><span th:unless="${alert != null}">INACTIVE</span></td>
        <td><span class="status active" th:if="${rule.active}">ACTIVE</span><span class="status inactive" th:unless="${rule.active}">INACTIVE</span></td>
        <td class="actions"><a class="button small" th:href="@{/reorder-rules/{id}/edit(id=${rule.id})}">Edit</a><form th:if="${rule.active}" th:action="@{/reorder-rules/{id}/deactivate(id=${rule.id})}" method="post"><button class="button small danger">Deactivate</button></form><form th:unless="${rule.active}" th:action="@{/reorder-rules/{id}/activate(id=${rule.id})}" method="post"><button class="button small primary">Activate</button></form><form th:action="@{/reorder-rules/{id}/delete(id=${rule.id})}" th:data-confirm-message="${'Permanently delete the reorder rule for ' + rule.product.sku + '? Stock and history are not affected. This cannot be undone.'}" method="post"><button class="button small danger">Delete</button></form></td>
    </tr></tbody></table></div></div>
</main></body></html>
